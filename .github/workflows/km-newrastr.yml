name: KM New Rastreamento

# Abre um Chrome de verdade, entra no New Rastreamento e coleta o KM rodado dos
# caminhões de lá (o portal não tem API). Ver tools/km-newrastr/coletar.mjs.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = só login"
        default: teste
        type: choice
        options: [teste]

permissions:
  contents: read

concurrency:
  group: km-newrastr
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/km-newrastr
    steps:
      - name: Diagnóstico de rede
        working-directory: .
        run: |
          echo "IP/país do runner: $(curl -s --max-time 10 https://ipinfo.io/country) $(curl -s --max-time 10 https://ipinfo.io/region)"
          curl -sS -o /dev/null --max-time 30 -w "newrastreamentoonline.com.br → HTTP %{http_code} em %{time_total}s\n" https://newrastreamentoonline.com.br/new/login || echo "newrastreamentoonline.com.br → sem resposta em 30s"
          curl -sS -o /dev/null --max-time 30 -w "google.com → HTTP %{http_code} em %{time_total}s\n" https://www.google.com || true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node coletar.mjs
        env:
          MODO: ${{ inputs.modo || 'teste' }}
          NEWRASTR_EMAIL: ${{ secrets.NEWRASTR_EMAIL }}
          NEWRASTR_LOGIN: ${{ secrets.NEWRASTR_LOGIN }}
          NEWRASTR_PASS: ${{ secrets.NEWRASTR_PASS }}
